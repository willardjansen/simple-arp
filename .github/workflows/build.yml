name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      # JUCE is not vendored, so CMake fetches the pinned tag. Caching it keeps a build
      # to a couple of minutes rather than re-cloning the framework every time.
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # The harness catches stuck notes and timing drift without a DAW. A build that
      # fails this should never reach a release.
      - name: Test
        shell: bash
        run: |
          harness=$(find build -type f \( -name ArpTest -o -name ArpTest.exe \) | head -1)
          echo "running $harness"
          "$harness"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist stage
          vst3=$(find build -maxdepth 4 -name '*.vst3' | head -1)
          echo "packaging $vst3"

          if [ "$RUNNER_OS" = "macOS" ]; then
            # ditto preserves the bundle's symlinks and its ad-hoc signature; zip drops
            # both, and the result fails to load with no useful error.
            ditto "$vst3" "stage/$(basename "$vst3")"
            cp INSTALL.md stage/
            ditto -c -k --sequesterRsrc "stage" "dist/Simple Arp-macOS.zip"
          else
            cp -r "$vst3" stage/
            cp INSTALL.md stage/
            powershell -Command "Compress-Archive -Path 'stage/*' -DestinationPath 'dist/Simple Arp-Windows.zip'"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Simple Arp-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  # Tagging v1.0.0 and pushing the tag is the whole release process.
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          # Hand-written notes for whoever downloads this, with the commit log appended
          # underneath for anyone who wants the detail.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
